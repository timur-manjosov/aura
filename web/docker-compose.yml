# The web interface, as its own compose project.
#
# Not a pair of services added to the repository root's docker-compose.yml, on
# purpose. Aura and Epiphyte are already isolated from each other as separate
# compose projects with separate lifecycles, and this follows the same shape:
# `docker compose -f web/docker-compose.yml up -d` starts, stops and restarts
# the web interface without touching the running bot, and a crash-looping web
# container cannot take the bot's process down with it.
#
# The isolation is structural rather than conventional:
#   * a project name of its own, so `docker compose down` here can never
#     remove the bot's container;
#   * a network of its own, plus -- since Phase 4c -- exactly one shared
#     network, aura-billing, created by the bot's compose project, over which
#     the backend calls the bot's internal billing API. Nothing else is
#     shared; the bot publishes no port on it to the host;
#   * NO volume mount of ../data. This service never opens Aura's SQLite file
#     -- see web/README.md for why it does not need to, what it asks Discord
#     instead, and how subscription state reaches the bot without it;
#   * the backend publishes no host port at all. It is reachable only from the
#     frontend container over the internal network, so the OAuth callback and
#     every session cookie travel through exactly one origin;
#   * the frontend is published on the host's LOOPBACK interface only. On the
#     server the host's reverse proxy (web/deploy/Caddyfile.aura) reaches it
#     there and terminates TLS; nothing outside the host can reach it at all.
name: aura-web

# Every container here answers requests from the internet, so its log grows
# with whatever anyone sends -- a flood of refused requests included. Docker's
# default json-file driver never rotates; this caps each container's log at
# 50 MB on disk.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      AURA_WEB_HOST: "0.0.0.0"
      AURA_WEB_PORT: "8080"
      # The ONE address whose X-Forwarded-For the backend believes: the
      # frontend's, pinned below. Set here rather than in .env so the trust
      # rule and the address it names can only ever change together (a value
      # under `environment:` wins over env_file). See aura_web.client_address.
      AURA_WEB_TRUSTED_PROXY_ADDRESSES: "172.16.86.3"
    expose:
      - "8080"
    networks:
      aura-web:
        ipv4_address: 172.16.86.2
      aura-billing: {}
    logging: *bounded-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # A BUILD argument, not a runtime environment variable: Next bakes
        # rewrites into the build output, so a value supplied only at start-up
        # is ignored (see frontend/next.config.mjs). The service name, not
        # localhost -- inside the frontend container, 127.0.0.1 is itself.
        AURA_WEB_BACKEND_ORIGIN: "http://backend:8080"
    ports:
      # 127.0.0.1, never 0.0.0.0: Docker's published ports bypass the host
      # firewall, so binding every interface would expose plain HTTP next to
      # the TLS proxy that is meant to be the only way in.
      - "127.0.0.1:${AURA_WEB_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      aura-web:
        # Pinned so the backend can name it as its only trusted proxy. Both
        # containers are pinned, so Docker never hands this address to anyone
        # else on the network; the gateway (.1) -- which is how every process
        # on the host reaches a container -- is deliberately not trusted.
        ipv4_address: 172.16.86.3
    logging: *bounded-logging
    restart: unless-stopped

networks:
  # A fixed, private subnet outside Docker's automatic address pools, so it
  # never collides with a network Docker creates on its own. If it collides
  # with something on a particular machine, `up` refuses loudly ("Pool
  # overlaps"); change the subnet and BOTH pinned addresses together.
  aura-web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.86.0/28
  # Created by the repository root's docker-compose.yml. `external` rather than
  # declared here too, so neither project can delete it out from under the
  # other with `docker compose down`; it does mean the bot comes up first.
  aura-billing:
    name: aura-billing
    external: true
